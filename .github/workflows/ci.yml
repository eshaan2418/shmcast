name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: clang++, name: linux-clang }
          - { os: ubuntu-latest, cxx: g++, name: linux-gcc }
          - { os: macos-latest, cxx: clang++, name: macos-arm64 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build -j 1 --output-on-failure
      - name: Latency smoke (shared 2-4 vCPU runner; numbers are not meaningful)
        run: build/shmcast-bench pingpong 20000

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ "address,undefined", "thread" ]
    name: sanitize-${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DSHMCAST_SANITIZE=${{ matrix.sanitizer }}
      - run: cmake --build build -j 4
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build -j 1 --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSHMCAST_FUZZ=ON
          cmake --build build-fuzz --target fuzz-reader -j 4
      - run: mkdir -p corpus && build-fuzz/fuzz-reader corpus -max_total_time=120 -rss_limit_mb=2048
